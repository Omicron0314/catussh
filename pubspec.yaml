name: catussh
description: "SSH terminal, SFTP and a live server monitor, for Linux and Android."
publish_to: 'none'
version: 3.0.0+50

environment:
  sdk: ^3.13.5

dependencies:
  cryptography: ^2.9.0
  dartssh2: ^4.1.0
  desktop_drop: ^0.8.4
  dynamic_color: ^2.1.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  intl: any
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  tray_manager: ^0.8.0
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  window_manager: ^0.5.2
  xml: ^7.1.0
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/cat/
    - assets/icon/catussh.png
    - assets/LICENSE
    - assets/EULA
